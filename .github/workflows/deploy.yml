name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-englishconnect
  KEY_VAULT_NAME: kv-aif-voz-preprod-001
  KEY_VAULT_RESOURCE_GROUP: rg-aif-vozloop-preprod-001
  ACR_NAME: '' # Set after infra deployment
  CONTAINER_APP_NAME: '' # Set after infra deployment

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd src/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run backend tests
        run: |
          cd src/backend
          python -m pytest tests/ -v --cov=app || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd src/frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd src/frontend
          npm run test:run || true

  deploy-infra:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      acr-name: ${{ steps.get-acr.outputs.acr_name }}
      azure-ad-client-id: ${{ steps.get-secrets.outputs.azure_ad_client_id }}
      azure-ad-tenant-id: ${{ steps.get-secrets.outputs.azure_ad_tenant_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get secrets from Key Vault
        id: get-secrets
        run: |
          # Fetch secrets from Key Vault for deployment
          AZURE_AD_CLIENT_ID=$(az keyvault secret show \
            --vault-name ${{ env.KEY_VAULT_NAME }} \
            --name azure-ad-client-id \
            --query value -o tsv 2>/dev/null || echo "")
          AZURE_AD_TENANT_ID=$(az keyvault secret show \
            --vault-name ${{ env.KEY_VAULT_NAME }} \
            --name azure-ad-tenant-id \
            --query value -o tsv 2>/dev/null || echo "")

          # Use Key Vault values if available, otherwise fall back to GitHub secrets
          if [ -n "$AZURE_AD_CLIENT_ID" ]; then
            echo "azure_ad_client_id=$AZURE_AD_CLIENT_ID" >> $GITHUB_OUTPUT
            echo "::add-mask::$AZURE_AD_CLIENT_ID"
          else
            echo "azure_ad_client_id=${{ secrets.AZURE_AD_CLIENT_ID }}" >> $GITHUB_OUTPUT
          fi

          if [ -n "$AZURE_AD_TENANT_ID" ]; then
            echo "azure_ad_tenant_id=$AZURE_AD_TENANT_ID" >> $GITHUB_OUTPUT
            echo "::add-mask::$AZURE_AD_TENANT_ID"
          else
            echo "azure_ad_tenant_id=${{ secrets.AZURE_AD_TENANT_ID }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Bicep infrastructure
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./azure/infra/main.bicep
          parameters: >-
            ./azure/infra/parameters/dev.bicepparam
            azureAdClientId=${{ steps.get-secrets.outputs.azure_ad_client_id }}
            azureAdTenantId=${{ steps.get-secrets.outputs.azure_ad_tenant_id }}
            keyVaultName=${{ env.KEY_VAULT_NAME }}
          failOnStdErr: false

      - name: Grant managed identity Key Vault access
        run: |
          # Get the managed identity principal ID
          PRINCIPAL_ID=$(az deployment group show \
            -g ${{ env.AZURE_RESOURCE_GROUP }} \
            -n container-app \
            --query properties.outputs.managedIdentityPrincipalId.value -o tsv 2>/dev/null || \
            az identity list -g ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].principalId" -o tsv)

          if [ -n "$PRINCIPAL_ID" ]; then
            echo "Granting Key Vault Secrets User role to managed identity..."
            # Get Key Vault resource ID
            KV_ID=$(az keyvault show \
              --name ${{ env.KEY_VAULT_NAME }} \
              --resource-group ${{ env.KEY_VAULT_RESOURCE_GROUP }} \
              --query id -o tsv)

            # Check if role assignment already exists
            EXISTING=$(az role assignment list \
              --assignee $PRINCIPAL_ID \
              --role "Key Vault Secrets User" \
              --scope $KV_ID \
              --query "[0].id" -o tsv 2>/dev/null || echo "")

            if [ -z "$EXISTING" ]; then
              az role assignment create \
                --assignee-object-id $PRINCIPAL_ID \
                --assignee-principal-type ServicePrincipal \
                --role "Key Vault Secrets User" \
                --scope $KV_ID
              echo "Role assignment created"
            else
              echo "Role assignment already exists"
            fi
          else
            echo "Warning: Could not find managed identity principal ID"
          fi

      - name: Get ACR name from deployment
        id: get-acr
        run: |
          ACR_NAME=$(az acr list -g ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT

  build-and-push:
    needs: deploy-infra
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      sha-tag: ${{ steps.vars.outputs.sha_short }}
      acr-name: ${{ needs.deploy-infra.outputs.acr-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ needs.deploy-infra.outputs.acr-name }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.deploy-infra.outputs.acr-name }}.azurecr.io/englishconnect
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile.combined
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: true
          build-args: |
            VITE_AZURE_AD_CLIENT_ID=${{ needs.deploy-infra.outputs.azure-ad-client-id }}
            VITE_AZURE_AD_TENANT_ID=${{ needs.deploy-infra.outputs.azure-ad-tenant-id }}

  deploy-app:
    needs: [deploy-infra, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Container App name
        id: get-ca
        run: |
          CA_NAME=$(az containerapp list -g ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          echo "ca_name=$CA_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to Container App
        run: |
          # Use SHA tag and revision suffix to ensure Container Apps creates a new revision
          # (using 'latest' can cause caching issues where the new image isn't pulled)
          az containerapp update \
            --name ${{ steps.get-ca.outputs.ca_name }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ needs.build-and-push.outputs.acr-name }}.azurecr.io/englishconnect:${{ needs.build-and-push.outputs.sha-tag }} \
            --revision-suffix ${{ needs.build-and-push.outputs.sha-tag }}

      - name: Configure custom domain
        env:
          CUSTOM_DOMAIN: englishconnect.vozloop.com
        run: |
          # Get the Container Apps Environment name
          CA_ENV=$(az containerapp env list -g ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)

          # Check if custom domain already configured
          EXISTING_DOMAIN=$(az containerapp hostname list \
            --name ${{ steps.get-ca.outputs.ca_name }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?name=='$CUSTOM_DOMAIN'].name" -o tsv)

          if [ -z "$EXISTING_DOMAIN" ]; then
            echo "Adding custom domain: $CUSTOM_DOMAIN"
            # Add custom domain with managed certificate
            az containerapp hostname add \
              --name ${{ steps.get-ca.outputs.ca_name }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --hostname $CUSTOM_DOMAIN

            # Bind managed certificate (Azure will provision it)
            az containerapp hostname bind \
              --name ${{ steps.get-ca.outputs.ca_name }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --hostname $CUSTOM_DOMAIN \
              --environment $CA_ENV \
              --validation-method CNAME
          else
            echo "Custom domain $CUSTOM_DOMAIN already configured"
          fi

      - name: Get deployment URL
        run: |
          FQDN=$(az containerapp show \
            --name ${{ steps.get-ca.outputs.ca_name }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "## Deployment URL" >> $GITHUB_STEP_SUMMARY
          echo "https://$FQDN" >> $GITHUB_STEP_SUMMARY
